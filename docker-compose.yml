services:
  postgres:
    image: postgres:16
    container_name: de-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: defining_education
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d defining_education']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
